<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/c465c322e4.js" crossorigin="anonymous"></script>
  </head>

  <body>
    
    <header class="header">

      <div class="header-left">

        <div class="hamburger">
          <i class="fa-solid fa-bars"></i>
        </div>

        <div class="logo">
          <i class="fa-brands fa-youtube"></i> YouTube
        </div>

      </div>

      <div class="search-area">

        <input type="text" placeholder="Search">

        <button>
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button class="mic">
          <i class="fa-solid fa-microphone-lines"></i>
        </button>

      </div>

      <div class="header-right">

        <button class="create">
          <i class="fa-solid fa-plus"></i>
          Create
        </button>

        <button class="notification">
          <i class="fa-solid fa-bell"></i>
        </button>

        <button class="profile">
          M
        </button>

      </div>

    </header>

    <aside class="sidebar">

      <div class="sie-item-active">
        <i class="fa-solid fa-house"></i>
        Home
      </div>

      <div class="side-item">
        <i class="fa-brands fa-youtube-shorts"></i>
        Shorts
      </div>

      <hr>
    
      <h3>Subscriptions ></h3>

        <div class="side-item">
          <i class="fa-regular fa-circle-user"></i>
          <span>Name</span>
        </div>

        <div class="side-item">
          <i class="fa-regular fa-circle-user"></i>
          <span>Name</span>
        </div>

        <div class="side-item">
          <i class="fa-regular fa-circle-user"></i>
          <span>Name</span>
        </div>

        <div class="side-item">
          <i class="fa-regular fa-circle-user"></i>
          <span>Name</span>
        </div>

        <div class="side-item">
          <i class="fa-solid fa-chevron-down"></i>
          Show more
        </div>

        <hr>

        <h3>You <i class="fa-solid fa-angle-right"></i></h3>

        <div class="side-item">
          <i class="fa-regular fa-user"></i>
          Your channel
        </div>

        <div class="side-item">
          <i class="fa-solid fa-clock-rotate-left"></i>
          History
        </div>

        <div class="side-item">
          <i class="fa-solid fa-list"></i>
          Playlists
        </div>

        <div class="side-item">
          <i class="fa-regular fa-clock"></i>
          Watch later
        </div>

        <div class="side-item">
          <i class="fa-regular fa-thumbs-up"></i>
          Liked videos
        </div>

        <div class="side-item">
          <i class="fa-solid fa-download"></i>
          Downloads
        </div>

    </aside>

    <main class="main">

      <div class="topic-bar">

      </div>

      <div class="video-grid">

      </div>

    </main>

    <script src="script.js"></script>
  </body>
</html>
